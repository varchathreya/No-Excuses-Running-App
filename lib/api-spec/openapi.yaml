openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Session authentication operations
  - name: calendar
    description: Connected Google Calendar operations
  - name: quotes
    description: Daily motivational content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Check authenticated session
      description: |
        Preflight check used before sensitive operations. Returns the
        authenticated flag only when the Clerk bearer token was accepted.
        Never returns the token, its claims, or the raw Authorization header.
      responses:
        "200":
          description: Clerk session accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /calendar/preview:
    get:
      operationId: getCalendarPreview
      tags: [calendar]
      summary: Preview connected calendar events
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 56
            default: 7
      responses:
        "200":
          description: Calendar preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarPreview"
        "502":
          description: Calendar connection unavailable
  /calendar/oauth/start:
    post:
      operationId: startCalendarOAuth
      tags: [calendar]
      summary: Start Google Calendar authorization
      responses:
        "200":
          description: Google authorization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarOAuthStart"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /calendar/oauth/callback:
    get:
      operationId: completeCalendarOAuth
      tags: [calendar]
      summary: Complete Google Calendar authorization
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Authorization result page
          content:
            text/html:
              schema: { type: string }
        "400":
          description: Invalid or declined authorization
          content:
            text/html:
              schema: { type: string }
  /calendar/oauth/status:
    get:
      operationId: getCalendarOAuthStatus
      tags: [calendar]
      summary: Get Google Calendar connection status
      responses:
        "200":
          description: Calendar connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarOAuthStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /calendar/oauth/connection:
    delete:
      operationId: disconnectCalendarOAuth
      tags: [calendar]
      summary: Disconnect Google Calendar
      responses:
        "204":
          description: Calendar disconnected
        "401":
          $ref: "#/components/responses/Unauthorized"
  /quotes/daily:
    get:
      operationId: getDailyQuote
      tags: [quotes]
      summary: Get the motivational quote for a local calendar day
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Daily motivational quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQuote"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    AuthError:
      type: object
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - AUTH_TOKEN_REJECTED
        message:
          type: string
      required:
        - code
    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        summary: { type: string }
        start: { type: string }
        end: { type: string }
        htmlLink: { type: string }
      required: [id, summary, start, end]
    CalendarPreview:
      type: object
      properties:
        connected: { type: boolean }
        calendarName: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
      required: [connected, calendarName, events]
    CalendarOAuthStart:
      type: object
      properties:
        authorizationUrl: { type: string }
        callbackUrl: { type: string }
      required: [authorizationUrl, callbackUrl]
    CalendarOAuthStatus:
      type: object
      properties:
        connected: { type: boolean }
      required: [connected]
    DailyQuote:
      type: object
      properties:
        quote: { type: string }
        index: { type: number }
      required: [quote, index]
  responses:
    Unauthorized:
      description: Authentication required or rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthError"

