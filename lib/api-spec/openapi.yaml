openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: calendar
    description: Connected Google Calendar operations
  - name: quotes
    description: Daily motivational content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /calendar/preview:
    get:
      operationId: getCalendarPreview
      tags: [calendar]
      summary: Preview connected calendar events
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 42
            default: 7
      responses:
        "200":
          description: Calendar preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarPreview"
        "502":
          description: Calendar connection unavailable
  /calendar/workouts:
    post:
      operationId: createWorkoutCalendarEvents
      tags: [calendar]
      summary: Create workout events in the connected calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workouts:
                  type: array
                  items:
                    $ref: "#/components/schemas/WorkoutCalendarInput"
              required: [workouts]
      responses:
        "200":
          description: Created events
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: number
                required: [created]
        "502":
          description: Calendar connection unavailable
  /quotes/daily:
    get:
      operationId: getDailyQuote
      tags: [quotes]
      summary: Get the motivational quote for a local calendar day
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Daily motivational quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQuote"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CalendarEvent:
      type: object
      properties:
        id: { type: string }
        summary: { type: string }
        start: { type: string }
        end: { type: string }
        htmlLink: { type: string }
      required: [id, summary, start, end]
    CalendarPreview:
      type: object
      properties:
        connected: { type: boolean }
        calendarName: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
      required: [connected, calendarName, events]
    WorkoutCalendarInput:
      type: object
      properties:
        title: { type: string }
        start: { type: string }
        end: { type: string }
      required: [title, start, end]
    DailyQuote:
      type: object
      properties:
        quote: { type: string }
        index: { type: integer }
      required: [quote, index]

